<header class="site-header">
  <h1 class="site-title">
    <a href="{{ .Site.BaseURL }}">{{ .Site.Title }}</a>
  </h1>
  <nav class="site-nav">
    {{ range .Site.Menus.main }}
      {{ if hasPrefix .URL "http" }}
        <a href="{{ .URL }}" target="_blank" rel="noopener">
          {{ if eq .Pre "x-twitter" }}X{{ else if .Name }}{{ .Name }}{{ else }}Link{{ end }}
        </a>
      {{ else }}
        <a href="{{ .URL | relURL }}">{{ .Name }}</a>
      {{ end }}
    {{ end }}
    <div class="nav-controls">
      {{ if .Site.Params.enableSearch }}
      <button class="search-trigger" aria-label="Search" onclick="window.searchOpen()">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
      {{ end }}
      <button class="theme-toggle" aria-label="Toggle dark mode" onclick="window.toggleTheme()">
        <span class="theme-icon"></span>
      </button>
    </div>
  </nav>
</header>
