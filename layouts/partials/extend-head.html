{{ with resources.Get "css/syntax-light.css" }}
  {{ $syntaxLight := . | resources.Minify | fingerprint }}
  <link rel="stylesheet" href="{{ $syntaxLight.RelPermalink }}" id="syntax-light-custom" class="syntax-highlighter" media="(prefers-color-scheme: light)">
{{ end }}

{{ with resources.Get "css/syntax-dark.css" }}
  {{ $syntaxDark := . | resources.Minify | fingerprint }}
  <link rel="stylesheet" href="{{ $syntaxDark.RelPermalink }}" id="syntax-dark-custom" class="syntax-highlighter" media="(prefers-color-scheme: dark)">
{{ end }}

<!-- {{ if resources.Get "css/custom.css" }}
  {{ with resources.Get "css/custom.css" | css.Sass | resources.Minify }}
    <link rel="stylesheet" href="{{ .RelPermalink }}">
  {{ end }}
{{ end }} -->

<style id="custom-syntax-override"></style>

<!-- This script should run after the main bundle has loaded -->
<script>
document.addEventListener("DOMContentLoaded", function() {
  function updateSyntaxStylesheets() {
    const isDark = document.documentElement.classList.contains('dark');
    const lightSheet = document.getElementById('syntax-light-custom');
    const darkSheet = document.getElementById('syntax-dark-custom');
    
    if (lightSheet) {
      lightSheet.media = isDark ? 'none' : 'all';
    }
    
    if (darkSheet) {
      darkSheet.media = isDark ? 'all' : 'none';
    }
  }
  
  // Initial setup
  updateSyntaxStylesheets();
  
  // Watch for theme changes
  const observer = new MutationObserver(mutations => {
    mutations.forEach(mutation => {
      if (mutation.attributeName === 'class') {
        updateSyntaxStylesheets();
      }
    });
  });
  
  observer.observe(document.documentElement, { attributes: true });
});
</script>
